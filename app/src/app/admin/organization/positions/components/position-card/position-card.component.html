<ion-card class="position-card" (click)="onCardClick()">
    <ion-card-header>
        <ion-card-title>{{ position.name }}</ion-card-title>
    </ion-card-header>

    <ion-card-content>
        <div class="position-info">
            <div class="info-row">
                <span class="label">Nivel de Riesgo ARL:</span>
                <span class="value risk-badge" [attr.data-risk]="position.riskLevel">
                    Clase {{ position.riskLevel }}
                </span>
            </div>
        </div>
    </ion-card-content>
</ion-card>
