<ion-content class="onboarding-content">
    <!-- Hero Section (Dark Blue Top) -->
    <div class="hero-section">
        <div class="star star-1">✦</div>
        <div class="star star-2">✦</div>
        <div class="star star-3">✦</div>

        <!-- Hero Illustration -->
        <div class="hero-illustration">
            <div class="illustration-circle">
                <ion-icon name="shield-checkmark-outline" class="hero-icon"></ion-icon>
            </div>
        </div>
    </div>

    <!-- Bottom Card -->
    <div class="bottom-card">
        <div class="card-content">
            <h1 class="headline">Gestiona tu empresa con inteligencia.</h1>
            <p class="subheadline">
                Más que administración, transforma tus operaciones en resultados.
            </p>

            <ion-button expand="block" class="login-btn" (click)="goToLogin()">
                Iniciar sesión
            </ion-button>
        </div>
    </div>
</ion-content>
