<ion-content class="forgot-content">
  <div class="forgot-wrapper">
    <!-- Back Button -->
    <div class="back-btn-row">
      <ion-button fill="clear" class="back-btn" (click)="goBack()">
        <ion-icon name="chevron-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </div>

    <!-- Header -->
    <div class="forgot-header">
      <h1 class="forgot-title">Recuperar contraseña</h1>
      <p class="forgot-subtitle">
        Introduce el correo electrónico asociado a tu cuenta y te enviaremos un enlace para restablecer tu contraseña.
      </p>
    </div>

    <!-- Form -->
    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="forgot-form">

      <!-- Email -->
      <div class="field-group">
        <label class="field-label">Correo electrónico</label>
        <div class="input-wrapper" [class.error]="emailCtrl.invalid && emailCtrl.touched">
          <ion-icon name="mail-outline" class="input-icon"></ion-icon>
          <input id="email-input" type="email" formControlName="email" placeholder="tu@correo.com" autocomplete="email"
            class="custom-input" />
        </div>
        <div class="field-error" *ngIf="emailCtrl.touched && emailCtrl.hasError('required')">
          El correo electrónico es requerido.
        </div>
        <div class="field-error" *ngIf="emailCtrl.touched && emailCtrl.hasError('email')">
          Introduce un correo electrónico válido.
        </div>
      </div>

      <!-- Submit Button -->
      <ion-button id="forgot-submit-btn" expand="block" type="submit" class="submit-btn"
        [disabled]="isLoading || (emailCtrl.invalid && emailCtrl.touched)">
        <ion-icon name="paper-plane-outline" slot="start" *ngIf="!isLoading"></ion-icon>
        <ion-spinner name="crescent" *ngIf="isLoading" slot="start"></ion-spinner>
        {{ isLoading ? 'Enviando...' : 'Enviar enlace' }}
      </ion-button>

    </form>

  </div>
</ion-content>
