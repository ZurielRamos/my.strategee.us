<ion-content class="reset-content">
  <div class="reset-wrapper">
    <!-- Back Button -->
    <div class="back-btn-row">
      <ion-button fill="clear" class="back-btn" (click)="goBack()">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </div>

    <!-- Header -->
    <div class="reset-header">
      <h1 class="reset-title">Crear nueva contraseña</h1>
      <p class="reset-subtitle">
        Introduce tu nueva contraseña. Asegúrate de que tenga al menos 8 caracteres.
      </p>
    </div>

    <!-- Form -->
    <form *ngIf="resetForm" [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="reset-form">

      <!-- Password -->
      <div class="field-group">
        <label class="field-label">Nueva contraseña</label>
        <div class="input-wrapper" [class.error]="passwordCtrl.invalid && passwordCtrl.touched">
          <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
          <input id="new-password-input" [type]="showPassword ? 'text' : 'password'" formControlName="password"
            placeholder="••••••••" autocomplete="new-password" class="custom-input" />
          <button type="button" class="toggle-pw-btn" (click)="togglePasswordVisibility()">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
        <div class="field-error" *ngIf="passwordCtrl.touched && passwordCtrl.hasError('required')">
          La contraseña es requerida.
        </div>
        <div class="field-error" *ngIf="passwordCtrl.touched && passwordCtrl.hasError('minlength')">
          La contraseña debe tener al menos 8 caracteres.
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="field-group">
        <label class="field-label">Confirmar contraseña</label>
        <div class="input-wrapper"
          [class.error]="(confirmCtrl.invalid || resetForm.hasError('mismatch')) && confirmCtrl.touched">
          <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
          <input id="confirm-password-input" [type]="showPassword ? 'text' : 'password'"
            formControlName="confirmPassword" placeholder="••••••••" autocomplete="new-password" class="custom-input" />
        </div>
        <div class="field-error" *ngIf="confirmCtrl.touched && confirmCtrl.hasError('required')">
          Debes confirmar tu contraseña.
        </div>
        <div class="field-error"
          *ngIf="confirmCtrl.touched && resetForm.hasError('mismatch') && !confirmCtrl.hasError('required')">
          Las contraseñas no coinciden.
        </div>
      </div>

      <!-- Submit Button -->
      <ion-button id="reset-submit-btn" expand="block" type="submit" class="submit-btn" [disabled]="isLoading">
        <ion-icon name="save-outline" slot="start" *ngIf="!isLoading"></ion-icon>
        <ion-spinner name="crescent" *ngIf="isLoading" slot="start"></ion-spinner>
        {{ isLoading ? 'Guardando...' : 'Cambiar contraseña' }}
      </ion-button>

    </form>

  </div>
</ion-content>
