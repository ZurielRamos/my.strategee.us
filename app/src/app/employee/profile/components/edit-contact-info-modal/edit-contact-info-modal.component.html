<app-base-modal
    title="Actualizar Datos de Contacto"
    subtitle="Solo puedes editar dirección, teléfono y email personal"
    confirmText="Guardar Cambios"
    [confirmDisabled]="form.invalid"
    [loading]="isSubmitting"
    (modalDismiss)="onDismiss()"
    (modalConfirm)="onConfirm()">

    <form [formGroup]="form">
        <app-text-input
            formControlName="phone"
            label="Teléfono Personal"
            placeholder="Ej: 3001234567"
            type="tel"
            [required]="true">
        </app-text-input>

        <app-text-input
            formControlName="personalEmail"
            label="Email Personal"
            placeholder="Ej: juan@email.com"
            type="email"
            [required]="true">
        </app-text-input>

        <app-textarea-input
            formControlName="address"
            label="Dirección"
            placeholder="Ej: Calle 123 #45-67, Bogotá"
            [rows]="2">
        </app-textarea-input>
    </form>
</app-base-modal>
