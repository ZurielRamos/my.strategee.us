<app-base-modal 
    title="Cambiar Contraseña"
    subtitle="Actualiza tu contraseña de acceso"
    confirmText="Cambiar Contraseña"
    [confirmDisabled]="!passwordForm.valid"
    [loading]="isSubmitting"
    (modalDismiss)="onDismiss()"
    (modalConfirm)="onConfirm()">
    
    <form [formGroup]="passwordForm">
        <!-- Requisitos de contraseña -->
        <app-alert-box type="info">
            <strong>Requisitos de contraseña:</strong>
            <ul style="margin: 8px 0 0 0; padding-left: 20px;">
                <li>Mínimo 8 caracteres</li>
                <li>Se recomienda usar letras mayúsculas, minúsculas, números y símbolos</li>
            </ul>
        </app-alert-box>

        <!-- Contraseña actual -->
        <app-text-input
            formControlName="currentPassword"
            label="Contraseña Actual"
            type="password"
            placeholder="Ingresa tu contraseña actual"
            [required]="true"
            autocomplete="current-password">
        </app-text-input>

        <!-- Nueva contraseña -->
        <app-text-input
            formControlName="newPassword"
            label="Nueva Contraseña"
            type="password"
            placeholder="Ingresa tu nueva contraseña"
            [required]="true"
            [minlength]="8"
            autocomplete="new-password">
        </app-text-input>

        <!-- Confirmar contraseña -->
        <app-text-input
            formControlName="confirmPassword"
            label="Confirmar Nueva Contraseña"
            type="password"
            placeholder="Confirma tu nueva contraseña"
            [required]="true"
            autocomplete="new-password">
        </app-text-input>

        <!-- Error de contraseñas no coinciden -->
        @if (hasPasswordMismatch) {
            <div class="error-message">
                Las contraseñas no coinciden
            </div>
        }
    </form>
</app-base-modal>
