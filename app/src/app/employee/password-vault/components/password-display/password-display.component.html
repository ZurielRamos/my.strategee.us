<div class="password-display">
  <div class="password-field">
    <span class="password-label">{{ label }}</span>
    <div class="password-value-container">
      <span class="password-value">{{ getDisplayValue() }}</span>
      <ion-button fill="clear" size="small" (click)="toggleVisibility()">
        <ion-icon slot="icon-only" [name]="getIconName()"></ion-icon>
      </ion-button>
    </div>
  </div>
</div>
