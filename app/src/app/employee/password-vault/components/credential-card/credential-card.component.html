<ion-card class="credential-card" (click)="onCardClick()">
  <ion-card-header>
    <div class="card-header-content">
      <div class="credential-logo">
        @if (hasValidLogo()) {
          <ion-avatar>
            <img [src]="credential.logo!.url" [alt]="credential.logo!.title || 'Logo'" />
          </ion-avatar>
        } @else {
          <div class="default-logo">
            <ion-icon name="globe-outline"></ion-icon>
          </div>
        }
      </div>
      <div class="credential-info">
        <ion-card-title>{{ getDisplayTitle() }}</ion-card-title>
        <ion-card-subtitle>{{ credential.url }}</ion-card-subtitle>
      </div>
    </div>
  </ion-card-header>

  <ion-card-content>
    <div class="credential-meta">
      @if (credential.vault) {
        <div class="meta-item">
          <ion-icon name="folder-outline"></ion-icon>
          <span>{{ credential.vault.name }}</span>
        </div>
      }
      @if (credential.owner) {
        <div class="meta-item">
          <ion-icon name="person-outline"></ion-icon>
          <span>{{ credential.owner.firstName }} {{ credential.owner.lastName }}</span>
        </div>
      }
    </div>
  </ion-card-content>
</ion-card>
