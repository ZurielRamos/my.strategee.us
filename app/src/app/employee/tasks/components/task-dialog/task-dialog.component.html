<app-base-modal
    [title]="title"
    cancelText="Cancelar"
    [confirmText]="confirmText"
    [confirmDisabled]="!canConfirm"
    [class.danger]="danger"
    (modalDismiss)="dismiss()"
    (modalConfirm)="confirm()">

    @if (mode === 'confirm') {
        <div class="confirm-body" [class.danger]="danger">
            <div class="confirm-icon">
                <ion-icon [name]="danger ? 'warning-outline' : 'checkmark-done-outline'"></ion-icon>
            </div>
            <p>{{ message }}</p>
        </div>
    }

    @if (mode === 'prompt') {
        @if (message) {
            <p class="dialog-message">{{ message }}</p>
        }
        <form [formGroup]="form" (ngSubmit)="confirm()">
            <app-text-input
                [formControl]="input"
                [label]="label"
                [placeholder]="placeholder"
                [required]="true"
                [maxlength]="maxlength"
                [selectOnFocus]="true">
            </app-text-input>
        </form>
    }

    @if (mode === 'choose') {
        @if (message) {
            <p class="dialog-message">{{ message }}</p>
        }
        <div class="option-list" role="radiogroup">
            @for (option of options; track option.value) {
                <button
                    type="button"
                    class="option"
                    role="radio"
                    [attr.aria-checked]="selected === option.value"
                    [class.selected]="selected === option.value"
                    (click)="selected = option.value">
                    <span class="radio"><span class="radio-dot"></span></span>
                    <span class="option-text">
                        <span class="option-label">{{ option.label }}</span>
                        @if (option.hint) {
                            <span class="option-hint">{{ option.hint }}</span>
                        }
                    </span>
                </button>
            }
        </div>
    }
</app-base-modal>
