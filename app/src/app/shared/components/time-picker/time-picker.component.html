<ion-modal [isOpen]="isOpen" (didDismiss)="onDismiss()">
  <ng-template>
    <ion-datetime
      presentation="time"
      [value]="value"
      (ionChange)="onTimeChange($event)"
      locale="es-ES"
      [showDefaultButtons]="true"
      [cancelText]="cancelText"
      [doneText]="doneText">
    </ion-datetime>
  </ng-template>
</ion-modal>
