<div class="text-input-container">
    <ion-item lines="none">
        <ion-label position="stacked">
            {{ label }}
            @if (required) {
                <span class="required-indicator"> *</span>
            }
        </ion-label>
        <ion-input
            [type]="type"
            [value]="value"
            [placeholder]="placeholder"
            [maxlength]="maxlength"
            [minlength]="minlength"
            [min]="min"
            [max]="max"
            [pattern]="pattern"
            [autocomplete]="autocomplete"
            [readonly]="readonly"
            [disabled]="disabled"
            (ionInput)="onValueChange($event)"
            (ionBlur)="onBlur()">
        </ion-input>
        
        @if (helperText) {
            <ion-note slot="helper">
                @if (helperIcon) {
                    <ion-icon [name]="helperIcon"></ion-icon>
                }
                {{ helperText }}
            </ion-note>
        }
    </ion-item>
</div>
