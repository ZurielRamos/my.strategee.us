<ion-item lines="none">
    <ion-label position="stacked">{{ displayLabel }}</ion-label>
    <ion-select 
        [value]="value"
        (ionChange)="onValueChange($event)"
        [placeholder]="placeholder"
        [interface]="interface"
        [disabled]="disabled">
        @for (option of options; track option.value) {
            <ion-select-option [value]="option.value">
                {{ option.label }}
            </ion-select-option>
        }
    </ion-select>
    @if (helperText) {
        <ion-note slot="helper">
            @if (helperIcon) {
                <ion-icon [name]="helperIcon"></ion-icon>
            }
            {{ helperText }}
        </ion-note>
    }
</ion-item>
